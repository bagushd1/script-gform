<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>War GForm Timer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    label { font-weight: 600; display: block; margin-top: 14px; font-size: 14px; }
    input, textarea, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    .row { display: flex; gap: 8px; }
    .btn-main { margin-top: 20px; background: #0b57d0; color: #fff; font-weight: bold; border: none; cursor: pointer; transition: background 0.15s; }
    .btn-main:disabled { background: #888; cursor: not-allowed; opacity: 0.7; }
    .btn-action { background: #1a73e8; color: #fff; border: none; cursor: pointer; font-weight: 600; padding: 10px; margin-top: 6px; }
    #status { margin-top: 15px; font-size: 14px; padding: 12px; background: #f0f4f9; border: 1px solid #d0d7de; border-radius: 6px; font-weight: 500; transition: all 0.2s ease; }
    #status.waiting { background: #fff8e1; border-color: #ffe082; color: #b78103; }
    #status.sent { background: #e8f5e9; border-color: #a5d6a7; color: #1b5e20; }
    .pulse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #b78103; margin-right: 6px; animation: blink 0.8s infinite alternate ease-in-out; vertical-align: middle; }
    @keyframes blink { from { opacity: 0.25; transform: scale(0.85); } to { opacity: 1; transform: scale(1.15); } }
    #fields-container { margin-top: 14px; padding: 12px; background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; }
    .field-group { margin-bottom: 12px; }
    .field-group:last-child { margin-bottom: 0; }
    .field-group label { margin-top: 0; font-size: 13px; color: #222; }
    .hint { font-size: 12px; color: #666; margin-top: 2px; }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
    <h2 style="margin: 0;">War GForm Timer</h2>
    <div style="font-size: 13px; font-weight: 600; color: #333; background: #e8f0fe; padding: 4px 10px; border-radius: 4px; border: 1px solid #c2e7ff; display: flex; align-items: center; gap: 4px;">
      Jam: <span id="clock" style="font-family: monospace; color: #0b57d0; font-size: 14px;">--:--:--</span>
      <span id="sync_badge" style="font-size: 10px; color: #137333; background: #e6f4ea; padding: 1px 4px; border-radius: 3px;">Sync...</span>
    </div>
  </div>

  <label for="source_input">1. Paste Source HTML Google Form (Ctrl+U):</label>
  <div class="hint">Buka form &gt; tekan Ctrl+U (atau ketik <code>view-source:</code> di HP) &gt; salin semua &gt; paste di bawah:</div>
  <textarea id="source_input" rows="4" placeholder="Paste kode HTML source Google Form di sini..." onpaste="setTimeout(extractFromSource, 100)"></textarea>
  <button type="button" class="btn-action" onclick="extractFromSource()">Ekstrak Form</button>

  <label for="url">URL Target Google Form:</label>
  <input id="url" placeholder="Otomatis terisi setelah ekstrak source HTML">

  <div id="fields-container" style="display:none;">
    <div style="font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #0b57d0;">2. Isi Jawaban Form:</div>
    <div id="dynamic-fields"></div>
  </div>

  <label>3. Waktu Tembak (Jam : Menit : Detik):</label>
  <div class="row">
    <input id="h" type="number" value="7" min="0" max="23" title="Jam">
    <input id="m" type="number" value="0" min="0" max="59" title="Menit">
    <input id="s" type="number" value="0" min="0" max="59" title="Detik">
  </div>

  <div style="font-size: 12px; color: #137333; margin-top: 8px; display: flex; align-items: center; gap: 6px;">
    <span>&#128274;</span>
    <span><strong>Single Shot Mode</strong> (Tembak tepat 1x saat detik target tiba, dilarang tembak mendahului)</span>
  </div>

  <div class="row" style="margin-top: 16px;">
    <button id="btn" class="btn-main" style="margin-top: 0;" onclick="startWar()">Pasang Timer</button>
    <button id="btn_cancel" class="btn-action" style="margin-top: 0; background: #c5221f; display: none;" onclick="cancelTimer()">Batal</button>
    <button id="btn_export" class="btn-action" style="margin-top: 0; background: #1a73e8; display: none;" onclick="exportCloudShellConfig()">Ekspor Config Cloud Shell</button>
  </div>
  <div id="status">Status: Silakan paste source HTML form untuk mulai.</div>

  <!-- Audio hening untuk mencegah browser HP menidurkan proses saat di-minimize -->
  <audio id="keep_alive_audio" loop playsinline style="display:none;" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

  <!-- shortcut: iframe ignores response body to avoid CORS, upgrade to backend proxy if HTTP code check is required -->
  <iframe name="hidden_frame" style="display:none;"></iframe>
  <form id="gform" method="POST" target="hidden_frame" style="display:none;"></form>

  <script>
    let timer = null;
    let timerWorker = null;
    let loadedFields = [];
    let wakeLock = null;
    let currentFormMeta = { pageHistory: "0", fbzx: null, fvv: "1" };
    let serverTimeOffset = 0;

    function getNow() {
      return Date.now() + serverTimeOffset;
    }

    async function syncServerTime() {
      try {
        const t0 = performance.now();
        const res = await fetch("https://api.github.com", { method: "HEAD" });
        const t1 = performance.now();
        const dateHeader = res.headers.get("date");
        if (dateHeader) {
          const serverMs = new Date(dateHeader).getTime() + Math.round((t1 - t0) / 2);
          serverTimeOffset = serverMs - Date.now();
          const badge = document.getElementById("sync_badge");
          if (badge) {
            const sign = serverTimeOffset >= 0 ? "+" : "";
            badge.innerText = `Sync (${sign}${serverTimeOffset}ms)`;
          }
        }
      } catch (e) {
        const badge = document.getElementById("sync_badge");
        if (badge) badge.innerText = "Lokal";
      }
    }

    function initTimerWorker(tickFn) {
      if (typeof Worker !== "undefined" && !timerWorker) {
        try {
          const blob = new Blob([
            "let tid = null;\n" +
            "self.onmessage = function(e) {\n" +
            "  if (e.data === 'start') {\n" +
            "    if (tid) clearInterval(tid);\n" +
            "    tid = setInterval(function() { self.postMessage('tick'); }, 20);\n" +
            "  } else if (e.data === 'stop') {\n" +
            "    if (tid) { clearInterval(tid); tid = null; }\n" +
            "  }\n" +
            "};"
          ], { type: "application/javascript" });
          timerWorker = new Worker(URL.createObjectURL(blob));
          timerWorker.onmessage = function(e) {
            if (e.data === 'tick' && typeof tickFn === 'function') tickFn();
          };
        } catch (e) {}
      }
    }

    function updateClock() {
      const el = document.getElementById("clock");
      if (el) el.innerText = new Date(getNow()).toTimeString().split(" ")[0];
    }

    // Cegah tab tertutup secara tidak sengaja saat timer aktif & jalankan jam real-time
    if (typeof window !== "undefined") {
      updateClock();
      setInterval(updateClock, 1000);
      syncServerTime();
      setInterval(syncServerTime, 60000);

      window.addEventListener("beforeunload", (e) => {
        if (timer) {
          e.preventDefault();
          e.returnValue = "Timer sedang berjalan! Jika ditutup, form gagal terkirim.";
        }
      });

      // Restore saved HTML and answers on load
      window.addEventListener("DOMContentLoaded", () => {
        restoreSavedState();
      });
    }

    function saveState() {
      try {
        if (typeof localStorage === "undefined") return;
        const src = document.getElementById("source_input").value;
        if (src) localStorage.setItem("war_gform_html", src);
        const answers = {};
        for (const f of loadedFields) {
          if (f.type === "checkbox") {
            const checked = [...document.querySelectorAll(`input[name="chk_${f.id}"]:checked`)].map(c => c.value);
            answers[`chk_${f.id}`] = checked;
          } else {
            const el = document.getElementById(`input_${f.id}`);
            if (el) answers[f.id] = el.value;
          }
          const otherEl = document.getElementById(`other_${f.id}`);
          if (otherEl) answers[`other_${f.id}`] = otherEl.value;
        }
        localStorage.setItem("war_gform_answers", JSON.stringify(answers));
      } catch (e) {}
    }

    function restoreSavedState() {
      try {
        if (typeof localStorage === "undefined") return;
        const savedHtml = localStorage.getItem("war_gform_html");
        if (savedHtml && !document.getElementById("source_input").value) {
          document.getElementById("source_input").value = savedHtml;
          extractFromSource(true);
          const savedAnswers = JSON.parse(localStorage.getItem("war_gform_answers") || "{}");
          for (const [k, v] of Object.entries(savedAnswers)) {
            if (Array.isArray(v)) {
              v.forEach(val => {
                const cb = document.querySelector(`input[name="${k}"][value="${val}"]`);
                if (cb) cb.checked = true;
              });
            } else {
              const el = document.getElementById(`input_${k}`) || document.getElementById(k);
              if (el) {
                el.value = v;
                if (el.tagName === "SELECT") toggleOther(el, k);
              }
            }
          }
        }
      } catch (e) {}
    }

    async function requestWakeLock() {
      if ("wakeLock" in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request("screen");
        } catch (e) {}
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; }).catch(() => {});
      }
    }

    function normalizeUrl(url) {
      return url.trim().replace(/\/viewform(\?.*)?$/, "/formResponse");
    }

    function parseSourceData(source) {
      // Bracket-counting extraction — O(n) tanpa regex backtracking pada HTML besar
      const marker = source.indexOf('FB_PUBLIC_LOAD_DATA_');
      let bracketStart = -1;
      if (marker !== -1) {
        bracketStart = source.indexOf('[', marker);
      } else {
        const trimmed = source.trim();
        if (trimmed.startsWith('[')) bracketStart = source.indexOf('[');
      }
      if (bracketStart === -1) return null;

      let depth = 0, inStr = false, esc = false, bracketEnd = -1;
      for (let i = bracketStart; i < source.length; i++) {
        const c = source[i];
        if (esc) { esc = false; continue; }
        if (c === '\\' && inStr) { esc = true; continue; }
        if (c === '"') { inStr = !inStr; continue; }
        if (inStr) continue;
        if (c === '[') depth++;
        else if (c === ']' && --depth === 0) { bracketEnd = i; break; }
      }
      if (bracketEnd === -1) return null;

      try {
        const data = JSON.parse(source.substring(bracketStart, bracketEnd + 1));
        let formPath = data[14];
        if (!formPath) {
          const formActionMatch = source.match(/<form[^>]+action="([^"]+)"/i);
          if (formActionMatch) {
            const pathMatch = formActionMatch[1].match(/\/forms\/(?:u\/\d+\/)?(?:d\/)?(e\/[^\/\s]+)/);
            if (pathMatch) formPath = pathMatch[1];
          }
        }
        const questions = (data[1] && data[1][1]) || [];

        const pageHistoryMatch = source.match(/name="pageHistory"\s+value="([^"]*)"/i) || source.match(/value="([^"]*)"\s+name="pageHistory"/i);
        const fbzxMatch = source.match(/name="fbzx"\s+value="([^"]*)"/i) || source.match(/value="([^"]*)"\s+name="fbzx"/i);
        const fvvMatch = source.match(/name="fvv"\s+value="([^"]*)"/i) || source.match(/value="([^"]*)"\s+name="fvv"/i);

        const pageHistory = pageHistoryMatch ? pageHistoryMatch[1] : "0";
        const fbzx = fbzxMatch ? fbzxMatch[1] : null;
        const fvv = fvvMatch ? fvvMatch[1] : "1";

        const fields = [];

        // Email: form mengumpulkan email jika ada input email di HTML atau settings[6] === 3
        const settings = Array.isArray(data[1]) && Array.isArray(data[1][10]) ? data[1][10] : null;
        const hasEmail = /<input[^>]+(?:type=["']email["']|autocomplete=["']email["']|name=["']emailAddress["'])/i.test(source) || (settings && settings[6] === 3);
        if (hasEmail) {
          fields.push({ id: "emailAddress", title: "Email", type: "email", options: null, hasOther: false, required: true });
        }

        questions.forEach(q => {
          const mainTitle = q[1];
          const qType = q[3];
          const items = q[4] || [];
          items.forEach(item => {
            if (!item) return;
            const entryId = item[0];
            const rawOptions = item[1];
            // o[4] === 1 is the "Other / Lainnya" option marker
            const hasOther = Array.isArray(rawOptions) && rawOptions.some(o => o[4] === 1);
            const options = Array.isArray(rawOptions)
              ? rawOptions.filter(o => o[0] && o[4] !== 1).map(o => o[0])
              : null;

            let type = "text";
            if (qType === 4 || qType === 8) type = "checkbox";
            else if (qType === 9) type = "date";
            else if (qType === 10) type = "time";
            else if (qType === 13) type = "file";
            else if (options && options.length > 0) type = "choice";

            const title = items.length > 1 && item[3] ? `${mainTitle} [${item[3]}]` : mainTitle;
            fields.push({ id: `entry.${entryId}`, title, type, options, hasOther, required: item[2] === 1 });
          });
        });

        // Sort by DOM order for shuffled forms
        const domMatches = [...source.matchAll(/data-params="([^"]+)"/g)];
        if (domMatches.length > 0) {
          const domOrder = new Map();
          domMatches.forEach((m, idx) => {
            const entryMatches = [...m[1].matchAll(/\[\[(\d+)/g)];
            entryMatches.forEach(em => domOrder.set(`entry.${em[1]}`, idx));
          });
          fields.sort((a, b) => {
            const posA = a.id === "emailAddress" ? -1 : (domOrder.has(a.id) ? domOrder.get(a.id) : 999);
            const posB = b.id === "emailAddress" ? -1 : (domOrder.has(b.id) ? domOrder.get(b.id) : 999);
            return posA - posB;
          });
        }

        return { formPath, fields, pageHistory, fbzx, fvv };
      } catch (e) {
        return null;
      }
    }

    function extractFromSource(silent) {
      const srcInput = document.getElementById("source_input");
      const src = srcInput ? srcInput.value.trim() : "";
      const statusEl = document.getElementById("status");

      if (!src) {
        if (!silent) alert("Silakan paste kode HTML source Google Form terlebih dahulu!");
        return;
      }
      if (src.startsWith("http://") || src.startsWith("https://") || (src.includes("docs.google.com/forms") && !src.includes("<"))) {
        if (!silent) alert("Perhatian: Yang Anda paste adalah LINK URL form, bukan source code HTML!\n\nCara mengambil Source Code:\n1. Buka link Google Form di tab baru\n2. Tekan Ctrl + U (atau di browser HP ketik 'view-source:' di depan link)\n3. Tekan Ctrl + A (Select All) lalu Ctrl + C (Copy)\n4. Paste semua kode HTML ke kotak ini, lalu klik 'Ekstrak Form'.");
        return;
      }

      const parsed = parseSourceData(src);

      if (parsed && parsed.fields.length > 0) {
        if (parsed.formPath) {
          document.getElementById("url").value = `https://docs.google.com/forms/d/${parsed.formPath}/viewform`;
        }
        currentFormMeta = { pageHistory: parsed.pageHistory, fbzx: parsed.fbzx, fvv: parsed.fvv };
        renderDynamicFields(parsed.fields);
        const expBtn = document.getElementById("btn_export");
        if (expBtn) expBtn.style.display = "inline-block";
        statusEl.className = "";
        statusEl.innerText = `Berhasil mengekstrak ${parsed.fields.length} pertanyaan! Silakan isi jawaban di bawah.`;
        saveState();
      } else {
        if (!silent) alert("Gagal membaca source code Google Form. Pastikan kode HTML yang di-paste lengkap dari awal sampai akhir.");
      }
    }

    function toggleOther(selectEl, id) {
      const otherInput = document.getElementById(`other_${id}`);
      if (!otherInput) return;
      const isOther = selectEl.value === "__other__" || /^(?:lainnya|other|yang\s*lain)/i.test(selectEl.value.trim());
      otherInput.style.display = isOther ? "block" : "none";
      if (isOther) otherInput.focus();
    }

    function renderDynamicFields(fields) {
      loadedFields = fields;
      const container = document.getElementById("fields-container");
      const listEl = document.getElementById("dynamic-fields");
      listEl.innerHTML = "";

      fields.forEach((f, idx) => {
        const group = document.createElement("div");
        group.className = "field-group";

        const label = document.createElement("label");
        label.innerText = `${idx + 1}. ${f.title}`;
        group.appendChild(label);

        if (f.type === "email" || f.id === "emailAddress") {
          const input = document.createElement("input");
          input.type = "email";
          input.id = `input_${f.id}`;
          input.placeholder = `Masukkan alamat email valid`;
          group.appendChild(input);
        } else if (f.type === "choice" && Array.isArray(f.options)) {
          const select = document.createElement("select");
          select.id = `input_${f.id}`;
          select.onchange = () => toggleOther(select, f.id);
          let html = `<option value="">-- Pilih opsi --</option>` +
            f.options.map(opt => `<option value="${opt}">${opt}</option>`).join("");
          if (f.hasOther) {
            html += `<option value="__other__">-- Yang lain / Lainnya (Isi teks sendiri) --</option>`;
          }
          select.innerHTML = html;
          group.appendChild(select);

          if (f.hasOther) {
            const otherInput = document.createElement("input");
            otherInput.id = `other_${f.id}`;
            otherInput.placeholder = `Ketik jawaban '${f.title}' (Yang lain) di sini...`;
            otherInput.style.display = "none";
            otherInput.style.marginTop = "6px";
            group.appendChild(otherInput);
          }
        } else if (f.type === "checkbox" && Array.isArray(f.options)) {
          const chkContainer = document.createElement("div");
          chkContainer.style.display = "flex";
          chkContainer.style.flexDirection = "column";
          chkContainer.style.gap = "6px";
          chkContainer.style.marginTop = "6px";
          f.options.forEach(opt => {
            const lbl = document.createElement("label");
            lbl.style.fontWeight = "normal";
            lbl.style.display = "flex";
            lbl.style.alignItems = "center";
            lbl.style.gap = "8px";
            lbl.style.cursor = "pointer";
            lbl.innerHTML = `<input type="checkbox" name="chk_${f.id}" value="${opt}" style="width:auto;margin:0;"> <span>${opt}</span>`;
            chkContainer.appendChild(lbl);
          });
          if (f.hasOther) {
            const lblOther = document.createElement("label");
            lblOther.style.fontWeight = "normal";
            lblOther.style.display = "flex";
            lblOther.style.alignItems = "center";
            lblOther.style.gap = "8px";
            lblOther.style.cursor = "pointer";
            lblOther.innerHTML = `<input type="checkbox" id="chk_other_toggle_${f.id}" value="__other__" style="width:auto;margin:0;" onchange="document.getElementById('other_${f.id}').style.display = this.checked ? 'block' : 'none'"> <span>Yang lain:</span>`;
            chkContainer.appendChild(lblOther);

            const otherInput = document.createElement("input");
            otherInput.id = `other_${f.id}`;
            otherInput.placeholder = `Ketik jawaban '${f.title}' (Yang lain) di sini...`;
            otherInput.style.display = "none";
            otherInput.style.marginTop = "4px";
            chkContainer.appendChild(otherInput);
          }
          group.appendChild(chkContainer);
        } else if (f.type === "date") {
          const input = document.createElement("input");
          input.type = "date";
          input.id = `input_${f.id}`;
          group.appendChild(input);
        } else if (f.type === "time") {
          const input = document.createElement("input");
          input.type = "time";
          input.id = `input_${f.id}`;
          group.appendChild(input);
        } else if (f.type === "file") {
          const notice = document.createElement("div");
          notice.style.fontSize = "12px";
          notice.style.color = "#c5221f";
          notice.style.marginTop = "4px";
          notice.innerText = "⚠️ Soal upload file memerlukan sesi Google Drive & tidak bisa diotomasi via POST.";
          group.appendChild(notice);
        } else {
          const input = document.createElement("input");
          input.id = `input_${f.id}`;
          input.placeholder = `Jawaban untuk ${f.title}`;
          group.appendChild(input);
        }

        listEl.appendChild(group);
      });

      container.oninput = saveState;
      container.onchange = saveState;
      container.style.display = "block";
    }

    function getEntriesToSubmit() {
      const entries = [];
      for (const f of loadedFields) {
        if (f.type === "checkbox") {
          const checked = document.querySelectorAll(`input[name="chk_${f.id}"]:checked`);
          checked.forEach(cb => entries.push([f.id, cb.value]));
          const otherCb = document.getElementById(`chk_other_toggle_${f.id}`);
          if (otherCb && otherCb.checked) {
            const otherEl = document.getElementById(`other_${f.id}`);
            const otherVal = otherEl ? otherEl.value.trim() : "";
            if (otherVal !== "") {
              entries.push([f.id, "__other_option__"]);
              entries.push([`${f.id}.other_option_response`, otherVal]);
            }
          }
        } else if (f.type === "date") {
          const el = document.getElementById(`input_${f.id}`);
          const val = el ? el.value.trim() : "";
          if (val) {
            const [y, m, d] = val.split("-");
            entries.push([`${f.id}_year`, y]);
            entries.push([`${f.id}_month`, String(parseInt(m, 10))]);
            entries.push([`${f.id}_day`, String(parseInt(d, 10))]);
            entries.push([f.id, val]);
          }
        } else if (f.type === "time") {
          const el = document.getElementById(`input_${f.id}`);
          const val = el ? el.value.trim() : "";
          if (val) {
            const [hh, mm] = val.split(":");
            entries.push([`${f.id}_hour`, hh]);
            entries.push([`${f.id}_minute`, mm]);
            entries.push([f.id, val]);
          }
        } else {
          const el = document.getElementById(`input_${f.id}`);
          if (!el) continue;

          if (el.tagName === "SELECT") {
            const isOther = el.value === "__other__" || /^(?:lainnya|other|yang\s*lain)/i.test(el.value.trim());
            if (isOther) {
              const otherEl = document.getElementById(`other_${f.id}`);
              const otherVal = otherEl ? otherEl.value.trim() : "";
              if (otherVal !== "") {
                entries.push([f.id, "__other_option__"]);
                entries.push([`${f.id}.other_option_response`, otherVal]);
              }
            } else if (el.value.trim() !== "") {
              entries.push([f.id, el.value.trim()]);
            }
          } else if (el.value.trim() !== "") {
            entries.push([f.id, el.value.trim()]);
          }
        }
      }
      return entries;
    }

    function exportCloudShellConfig() {
      const urlInput = document.getElementById("url").value.trim();
      const targetUrl = urlInput ? normalizeUrl(urlInput) : "";
      if (!targetUrl) {
        alert("Silakan ekstrak form terlebih dahulu!");
        return;
      }
      const h = String(document.getElementById("h").value).padStart(2, "0");
      const m = String(document.getElementById("m").value).padStart(2, "0");
      const s = String(document.getElementById("s").value).padStart(2, "0");
      const targetTime = `${h}:${m}:${s}`;
      const entries = getEntriesToSubmit();

      const configData = {
        targetUrl: targetUrl,
        targetTime: targetTime,
        pageHistory: currentFormMeta.pageHistory || "0",
        fbzx: currentFormMeta.fbzx || null,
        fvv: currentFormMeta.fvv || "1",
        entries: entries
      };

      const blob = new Blob([JSON.stringify(configData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "config.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    let rafId = null;
    let submitted = false;

    function preparePayload(targetUrl, entries) {
      const form = document.getElementById("gform");
      form.action = targetUrl;
      form.innerHTML = "";

      const searchParams = new URLSearchParams();
      if (currentFormMeta.pageHistory) {
        const inp = document.createElement("input");
        inp.name = "pageHistory";
        inp.value = currentFormMeta.pageHistory;
        form.appendChild(inp);
        searchParams.append("pageHistory", currentFormMeta.pageHistory);
      }
      if (currentFormMeta.fbzx) {
        const inp = document.createElement("input");
        inp.name = "fbzx";
        inp.value = currentFormMeta.fbzx;
        form.appendChild(inp);
        searchParams.append("fbzx", currentFormMeta.fbzx);
      }
      if (currentFormMeta.fvv) {
        const inp = document.createElement("input");
        inp.name = "fvv";
        inp.value = currentFormMeta.fvv;
        form.appendChild(inp);
        searchParams.append("fvv", currentFormMeta.fvv);
      }
      entries.forEach(([k, v]) => {
        const input = document.createElement("input");
        input.name = k;
        input.value = v;
        form.appendChild(input);
        searchParams.append(k, v);
      });

      return { form, searchParams };
    }

    function dispatchPayload(targetUrl, form, searchParams) {
      // Single Shot: tembak tepat 1x ke server Google
      let sent = false;
      try {
        if (typeof fetch === "function") {
          fetch(targetUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: searchParams.toString()
          }).catch(() => {});
          sent = true;
        }
      } catch (e) {}

      // Fallback ke form.submit hanya jika fetch tidak tersedia / gagal
      if (!sent) {
        try {
          form.submit();
        } catch (e) {}
      }
    }

    function cancelTimer() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
      if (timerWorker) {
        timerWorker.postMessage('stop');
      }
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      releaseWakeLock();
      const audioEl = document.getElementById("keep_alive_audio");
      if (audioEl) audioEl.pause();

      const btn = document.getElementById("btn");
      if (btn) btn.disabled = false;
      const cancelBtn = document.getElementById("btn_cancel");
      if (cancelBtn) cancelBtn.style.display = "none";
    }

    function validateEntries() {
      for (const f of loadedFields) {
        if (f.id === "emailAddress") {
          const el = document.getElementById(`input_${f.id}`);
          if (!el || !el.value.trim()) {
            alert("Kolom Email wajib diisi!");
            return false;
          }
        } else if (f.type === "choice") {
          const el = document.getElementById(`input_${f.id}`);
          if (!el) continue;
          const isOther = el.value === "__other__" || /^(?:lainnya|other|yang\s*lain)/i.test(el.value.trim());
          if (isOther) {
            const otherEl = document.getElementById(`other_${f.id}`);
            if (!otherEl || !otherEl.value.trim()) {
              alert(`Kolom teks "${f.title}" (Yang lain) wajib diisi jika memilih opsi tersebut!`);
              return false;
            }
          } else if (f.required && !el.value.trim()) {
            alert(`Pilih salah satu opsi untuk kolom wajib: "${f.title}"!`);
            return false;
          }
        } else if (f.type === "checkbox") {
          const checked = document.querySelectorAll(`input[name="chk_${f.id}"]:checked`);
          const otherCb = document.getElementById(`chk_other_toggle_${f.id}`);
          const hasOtherChecked = otherCb && otherCb.checked;
          if (f.required && checked.length === 0 && !hasOtherChecked) {
            alert(`Pilih minimal satu opsi untuk kolom wajib: "${f.title}"!`);
            return false;
          }
          if (hasOtherChecked) {
            const otherEl = document.getElementById(`other_${f.id}`);
            if (!otherEl || !otherEl.value.trim()) {
              alert(`Kolom teks "${f.title}" (Yang lain) wajib diisi jika memilih opsi tersebut!`);
              return false;
            }
          }
        } else if (f.type !== "file") {
          const el = document.getElementById(`input_${f.id}`);
          if (f.required && (!el || !el.value.trim())) {
            alert(`Kolom wajib diisi: "${f.title}"!`);
            return false;
          }
        }
      }
      return true;
    }

    function startWar() {
      const rawUrl = document.getElementById("url").value;
      const targetUrl = normalizeUrl(rawUrl);

      if (loadedFields.length === 0) {
        return alert("Silakan paste source HTML form dan klik 'Ekstrak Form' terlebih dahulu!");
      }

      if (!targetUrl.startsWith("http")) {
        return alert("URL Google Form tidak valid!");
      }

      if (!validateEntries()) return;

      const entries = getEntriesToSubmit();
      if (entries.length === 0) {
        return alert("Isi minimal satu kolom jawaban sebelum pasang timer!");
      }

      cancelTimer();
      submitted = false;

      // Pre-warm TCP + TLS connection
      try {
        fetch(targetUrl, { method: "HEAD", mode: "no-cors" }).catch(() => {});
      } catch (e) {}

      // Pre-serialize payload agar saat tembak latency CPU 0ms
      const { form, searchParams } = preparePayload(targetUrl, entries);

      const h = parseInt(document.getElementById("h").value, 10);
      const m = parseInt(document.getElementById("m").value, 10);
      const s = parseInt(document.getElementById("s").value, 10);

      const now = new Date(getNow());
      let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, s, 0);
      if (targetDate.getTime() <= now.getTime()) {
        if (now.getTime() - targetDate.getTime() > 5000) {
          targetDate.setDate(targetDate.getDate() + 1);
        }
      }
      const targetMs = targetDate.getTime();
      const targetTimeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      const btn = document.getElementById("btn");
      const cancelBtn = document.getElementById("btn_cancel");
      const statusEl = document.getElementById("status");
      const audioEl = document.getElementById("keep_alive_audio");

      btn.disabled = true;
      if (cancelBtn) cancelBtn.style.display = "inline-block";
      statusEl.className = "waiting";

      requestWakeLock();
      if (audioEl) audioEl.play().catch(() => {});

      let prewarmed3s = false;
      let prewarmed1s = false;
      let tightIntervalStarted = false;

      function executeSubmit() {
        const currentNow = getNow();
        // VALIDASI KETAT: Dilarang keras tembak sebelum detik target tiba (anti-diskualifikasi)
        if (currentNow < targetMs) return;
        if (submitted) return;
        submitted = true;
        cancelTimer();

        // Single Shot (Tembak tepat 1x)
        dispatchPayload(targetUrl, form, searchParams);

        statusEl.className = "sent";
        const d = new Date(currentNow);
        const sentTime = `${d.toTimeString().split(" ")[0]}.${String(d.getMilliseconds()).padStart(3, "0")}`;
        statusEl.innerHTML = `&#10004; <strong>Terkirim tepat waktu (1x tembak)!</strong> Form ditembak pada pukul <strong>${sentTime}</strong> (Target: ${targetTimeStr}).`;
      }

      function tick() {
        const currentNow = getNow();
        const remaining = targetMs - currentNow;
        if (remaining <= 0) {
          executeSubmit();
          return;
        }

        // Pre-warm TCP+TLS saat mendekati waktu tembak agar socket siap tanpa delay
        if (remaining <= 3000 && !prewarmed3s) {
          prewarmed3s = true;
          try { fetch(targetUrl, { method: "HEAD", mode: "no-cors" }).catch(() => {}); } catch (e) {}
        }
        if (remaining <= 1000 && !prewarmed1s) {
          prewarmed1s = true;
          try { fetch(targetUrl, { method: "HEAD", mode: "no-cors" }).catch(() => {}); } catch (e) {}
        }

        if (remaining > 1500) {
          const remSec = Math.floor(remaining / 1000);
          const remH = Math.floor(remSec / 3600);
          const remM = Math.floor((remSec % 3600) / 60);
          const remS = remSec % 60;
          statusEl.innerHTML = `<span class="pulse-dot"></span>Timer Aktif &bull; Target: <strong>${targetTimeStr}</strong> (Sisa: ${String(remH).padStart(2, '0')}:${String(remM).padStart(2, '0')}:${String(remS).padStart(2, '0')})`;
        } else {
          statusEl.innerHTML = `<span class="pulse-dot"></span>Bersiap tembak <strong>${targetTimeStr}</strong>... (${remaining}ms)`;

          // Masuk fase kritis (< 1.5 detik): aktifkan loop presisi tinggi tanpa mendahului detik target
          if (!tightIntervalStarted) {
            tightIntervalStarted = true;
            if (timer) clearInterval(timer);
            timer = setInterval(tick, 10);

            function tightLoop() {
              if (getNow() >= targetMs) {
                executeSubmit();
              } else if (!submitted) {
                rafId = requestAnimationFrame(tightLoop);
              }
            }
            tightLoop();
          }
        }
      }

      tick();
      if (!submitted && getNow() < targetMs) {
        timer = setInterval(tick, 50);
        initTimerWorker(tick);
        if (timerWorker) timerWorker.postMessage('start');
      }
    }

    if (typeof module !== "undefined" && module.exports) {
      module.exports = { normalizeUrl, parseSourceData, getEntriesToSubmit };
    }
  </script>
