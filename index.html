<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>War GForm Timer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    label { font-weight: 600; display: block; margin-top: 14px; font-size: 14px; }
    input, textarea, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    .row { display: flex; gap: 8px; }
    .btn-main { margin-top: 20px; background: #0b57d0; color: #fff; font-weight: bold; border: none; cursor: pointer; }
    .btn-main:disabled { background: #aaa; cursor: not-allowed; }
    .btn-action { width: auto; padding: 10px 14px; margin-top: 5px; background: #1a73e8; color: #fff; border: none; cursor: pointer; font-weight: 600; white-space: nowrap; }
    #status { margin-top: 15px; font-size: 14px; padding: 10px; background: #f0f4f9; border-radius: 4px; }
    #fields-container { margin-top: 12px; padding: 12px; background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; }
    .field-group { margin-bottom: 12px; }
    .field-group:last-child { margin-bottom: 0; }
    .field-group label { margin-top: 0; font-size: 13px; color: #222; }
    details { margin-top: 12px; font-size: 13px; color: #444; }
    summary { cursor: pointer; font-weight: 600; color: #0b57d0; }
  </style>
</head>
<body>
  <h2 style="margin-top:0;">War GForm Timer</h2>

  <label for="url">URL Google Form:</label>
  <div class="row">
    <input id="url" placeholder="https://docs.google.com/forms/d/e/.../viewform" oninput="handleUrlInput(this.value)">
    <button type="button" class="btn-action" onclick="fetchFormFields()">Muat Form</button>
  </div>

  <details style="margin-top: 8px;">
    <summary>Tanpa Server / Offline: Ekstrak dari Page Source (Ctrl+U)</summary>
    <div style="background: #f8f9fa; padding: 10px; border-radius: 4px; margin-top: 6px; border: 1px solid #e0e0e0;">
      <p style="margin: 0 0 6px 0; font-size: 13px;">Buka Google Form di tab browser &gt; tekan <strong>Ctrl+U</strong> &gt; salin semua kodenya (<strong>Ctrl+A</strong>, <strong>Ctrl+C</strong>) &gt; lalu paste di bawah:</p>
      <textarea id="source_input" rows="3" placeholder="Paste kode HTML source Google Form di sini..." style="font-size:12px;"></textarea>
      <button type="button" class="btn-action" style="margin-top: 6px; width: 100%;" onclick="extractFromSource()">Generate Kolom Pertanyaan</button>
    </div>
  </details>

  <div id="fields-container" style="display:none;">
    <div style="font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #0b57d0;">Isi Jawaban Form:</div>
    <div id="dynamic-fields"></div>
  </div>

  <div id="manual-section">
    <label for="entries">Data Entry Manual (Format: entry.ID=Nilai):</label>
    <textarea id="entries" rows="3" placeholder="entry.123456=Budi Santoso&#10;entry.987654=Senin"></textarea>
  </div>

  <label>Waktu Tembak (Jam : Menit : Detik):</label>
  <div class="row">
    <input id="h" type="number" value="8" min="0" max="23">
    <input id="m" type="number" value="0" min="0" max="59">
    <input id="s" type="number" value="0" min="0" max="59">
  </div>

  <button id="btn" class="btn-main" onclick="startWar()">Pasang Timer</button>
  <div id="status">Status: Siap</div>

  <!-- shortcut: iframe ignores response body to avoid CORS, upgrade to backend proxy if HTTP code check is required -->
  <iframe name="hidden_frame" style="display:none;"></iframe>
  <form id="gform" method="POST" target="hidden_frame" style="display:none;"></form>

  <script>
    let timer = null;
    let loadedFields = [];

    function normalizeUrl(url) {
      return url.trim().replace(/\/viewform(\?.*)?$/, "/formResponse");
    }

    function extractPrefilled(url) {
      try {
        const u = new URL(url.trim());
        const entries = [];
        u.searchParams.forEach((val, key) => {
          if (key.startsWith("entry.")) {
            entries.push(`${key}=${val}`);
          }
        });
        if (entries.length === 0) return null;
        return {
          cleanUrl: `${u.origin}${u.pathname}`,
          entriesText: entries.join("\n")
        };
      } catch (e) {
        return null;
      }
    }

    function parseSourceData(source) {
      const match = source.match(/FB_PUBLIC_LOAD_DATA_\s*=\s*(\[[\s\S]*?\]);\s*<\/script>/);
      if (!match) return null;
      try {
        const data = JSON.parse(match[1]);
        const formPath = data[14];
        const questions = data[1][1] || [];
        const fields = questions.map(q => {
          const title = q[1];
          const item = q[4] && q[4][0];
          if (!item) return null;
          const entryId = item[0];
          const rawOptions = item[1];
          const options = Array.isArray(rawOptions) ? rawOptions.map(o => o[0]) : null;
          return {
            id: `entry.${entryId}`,
            title,
            type: options ? "choice" : "text",
            options
          };
        }).filter(Boolean);

        return { formPath, fields };
      } catch (e) {
        return null;
      }
    }

    function extractFromSource() {
      const src = document.getElementById("source_input").value;
      const parsed = parseSourceData(src);
      if (parsed && parsed.fields.length > 0) {
        if (!document.getElementById("url").value && parsed.formPath) {
          document.getElementById("url").value = `https://docs.google.com/forms/d/${parsed.formPath}/viewform`;
        }
        renderDynamicFields(parsed.fields);
        document.getElementById("status").innerText = `Berhasil membuat ${parsed.fields.length} pertanyaan dari source code!`;
      } else {
        alert("Gagal membaca source code Google Form. Pastikan source code di-copy lengkap dari Ctrl+U.");
      }
    }

    function handleUrlInput(val) {
      if (val.includes("entry.")) {
        const res = extractPrefilled(val);
        if (res && res.entriesText) {
          document.getElementById("entries").value = res.entriesText;
          document.getElementById("status").innerText = "Data entry otomatis terdeteksi dari Pre-filled link!";
        }
      }
    }

    async function fetchFormFields() {
      const rawUrl = document.getElementById("url").value.trim();
      if (!rawUrl.startsWith("http")) return alert("Masukkan link Google Form yang valid!");

      const statusEl = document.getElementById("status");
      statusEl.innerText = "Membaca struktur form...";

      try {
        const res = await fetch(`/api/inspect?url=${encodeURIComponent(rawUrl)}`);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `Gagal membaca form (status ${res.status})`);
        }
        const data = await res.json();
        renderDynamicFields(data.fields);
        statusEl.innerText = `Berhasil memuat ${data.fields.length} pertanyaan! Silakan isi jawaban di bawah.`;
      } catch (err) {
        if (location.protocol === "file:") {
          alert("Mode file langsung tidak bisa fetch otomatis karena CORS. Gunakan menu 'Ekstrak dari Page Source (Ctrl+U)' di bawah, atau jalankan via server/Vercel.");
        } else {
          alert("Error: " + err.message);
        }
        statusEl.innerText = "Gagal memuat form secara otomatis. Gunakan mode manual/source.";
      }
    }

    function renderDynamicFields(fields) {
      loadedFields = fields;
      const container = document.getElementById("fields-container");
      const listEl = document.getElementById("dynamic-fields");
      listEl.innerHTML = "";

      fields.forEach((f, idx) => {
        const group = document.createElement("div");
        group.className = "field-group";

        const label = document.createElement("label");
        label.innerText = `${idx + 1}. ${f.title}`;
        group.appendChild(label);

        if (f.type === "choice" && Array.isArray(f.options)) {
          const select = document.createElement("select");
          select.id = `input_${f.id}`;
          select.innerHTML = `<option value="">-- Pilih opsi --</option>` +
            f.options.map(opt => `<option value="${opt}">${opt}</option>`).join("");
          group.appendChild(select);
        } else {
          const input = document.createElement("input");
          input.id = `input_${f.id}`;
          input.placeholder = `Jawaban untuk ${f.title}`;
          group.appendChild(input);
        }

        listEl.appendChild(group);
      });

      container.style.display = "block";
      document.getElementById("manual-section").style.display = "none";
    }

    function parseEntries(text) {
      return text.trim().split("\n").map(l => {
        const commentIdx = l.indexOf("//");
        const cleanLine = commentIdx !== -1 ? l.slice(0, commentIdx) : l;
        const idx = cleanLine.indexOf("=");
        if (idx === -1) return null;
        return [cleanLine.slice(0, idx).trim(), cleanLine.slice(idx + 1).trim()];
      }).filter(Boolean);
    }

    function getEntriesToSubmit() {
      if (loadedFields.length > 0) {
        const entries = [];
        for (const f of loadedFields) {
          const el = document.getElementById(`input_${f.id}`);
          if (el && el.value.trim() !== "") {
            entries.push([f.id, el.value.trim()]);
          }
        }
        return entries;
      }
      return parseEntries(document.getElementById("entries").value);
    }

    function startWar() {
      const rawUrl = document.getElementById("url").value;
      const targetUrl = normalizeUrl(rawUrl);
      const entries = getEntriesToSubmit();
      const h = parseInt(document.getElementById("h").value, 10);
      const m = parseInt(document.getElementById("m").value, 10);
      const s = parseInt(document.getElementById("s").value, 10);

      if (!targetUrl.startsWith("http")) return alert("Masukkan URL Google Form yang valid!");
      if (entries.length === 0) return alert("Isi minimal satu pertanyaan atau field entry!");

      const form = document.getElementById("gform");
      form.action = targetUrl;
      form.innerHTML = "";
      entries.forEach(([k, v]) => {
        const input = document.createElement("input");
        input.name = k;
        input.value = v;
        form.appendChild(input);
      });

      document.getElementById("btn").disabled = true;
      document.getElementById("status").innerText = `Timer aktif. Menunggu pukul ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}...`;

      timer = setInterval(() => {
        const now = new Date();
        if (now.getHours() === h && now.getMinutes() === m && now.getSeconds() >= s) {
          clearInterval(timer);
          form.submit();
          document.getElementById("status").innerText = "Terkirim! Form telah di-submit ke server.";
        }
      }, 50);
    }

    if (typeof module !== "undefined" && module.exports) {
      module.exports = { normalizeUrl, parseEntries, extractPrefilled, parseSourceData, getEntriesToSubmit };
    }
  </script>
</body>
</html>
