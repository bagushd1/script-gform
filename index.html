<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>War GForm Timer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    label { font-weight: 600; display: block; margin-top: 14px; font-size: 14px; }
    input, textarea, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    .row { display: flex; gap: 8px; }
    .btn-main { margin-top: 20px; background: #0b57d0; color: #fff; font-weight: bold; border: none; cursor: pointer; transition: background 0.15s; }
    .btn-main:disabled { background: #888; cursor: not-allowed; opacity: 0.7; }
    .btn-action { background: #1a73e8; color: #fff; border: none; cursor: pointer; font-weight: 600; padding: 10px; margin-top: 6px; }
    #status { margin-top: 15px; font-size: 14px; padding: 12px; background: #f0f4f9; border: 1px solid #d0d7de; border-radius: 6px; font-weight: 500; transition: all 0.2s ease; }
    #status.waiting { background: #fff8e1; border-color: #ffe082; color: #b78103; }
    #status.sent { background: #e8f5e9; border-color: #a5d6a7; color: #1b5e20; }
    .pulse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #b78103; margin-right: 6px; animation: blink 0.8s infinite alternate ease-in-out; vertical-align: middle; }
    @keyframes blink { from { opacity: 0.25; transform: scale(0.85); } to { opacity: 1; transform: scale(1.15); } }
    #fields-container { margin-top: 14px; padding: 12px; background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; }
    .field-group { margin-bottom: 12px; }
    .field-group:last-child { margin-bottom: 0; }
    .field-group label { margin-top: 0; font-size: 13px; color: #222; }
    .hint { font-size: 12px; color: #666; margin-top: 2px; }
  </style>
</head>
<body>
  <h2 style="margin-top:0;">War GForm Timer</h2>

  <label for="source_input">1. Paste Source HTML Google Form (Ctrl+U):</label>
  <div class="hint">Buka form &gt; tekan Ctrl+U (atau ketik <code>view-source:</code> di HP) &gt; salin semua &gt; paste di bawah:</div>
  <textarea id="source_input" rows="4" placeholder="Paste kode HTML source Google Form di sini..." onpaste="setTimeout(extractFromSource, 100)"></textarea>
  <button type="button" class="btn-action" onclick="extractFromSource()">Ekstrak Form</button>

  <label for="url">URL Target Google Form:</label>
  <input id="url" placeholder="Otomatis terisi setelah ekstrak source HTML">

  <div id="fields-container" style="display:none;">
    <div style="font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #0b57d0;">2. Isi Jawaban Form:</div>
    <div id="dynamic-fields"></div>
  </div>

  <label>3. Waktu Tembak (Jam : Menit : Detik):</label>
  <div class="row">
    <input id="h" type="number" value="8" min="0" max="23">
    <input id="m" type="number" value="0" min="0" max="59">
    <input id="s" type="number" value="0" min="0" max="59">
  </div>

  <button id="btn" class="btn-main" onclick="startWar()">Pasang Timer</button>
  <div id="status">Status: Silakan paste source HTML form untuk mulai.</div>

  <!-- Audio hening untuk mencegah browser HP menidurkan proses saat di-minimize -->
  <audio id="keep_alive_audio" loop playsinline style="display:none;" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

  <!-- shortcut: iframe ignores response body to avoid CORS, upgrade to backend proxy if HTTP code check is required -->
  <iframe name="hidden_frame" style="display:none;"></iframe>
  <form id="gform" method="POST" target="hidden_frame" style="display:none;"></form>

  <script>
    let timer = null;
    let loadedFields = [];
    let wakeLock = null;

    // Cegah tab tertutup secara tidak sengaja saat timer aktif
    if (typeof window !== "undefined") {
      window.addEventListener("beforeunload", (e) => {
        if (timer) {
          e.preventDefault();
          e.returnValue = "Timer sedang berjalan! Jika ditutup, form gagal terkirim.";
        }
      });
    }

    async function requestWakeLock() {
      if ("wakeLock" in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request("screen");
        } catch (e) {}
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; }).catch(() => {});
      }
    }

    function normalizeUrl(url) {
      return url.trim().replace(/\/viewform(\?.*)?$/, "/formResponse");
    }

    function parseSourceData(source) {
      const match = source.match(/FB_PUBLIC_LOAD_DATA_\s*=\s*(\[[\s\S]*?\]);\s*<\/script>/);
      if (!match) return null;
      try {
        const data = JSON.parse(match[1]);
        const formPath = data[14];
        const questions = data[1][1] || [];
        const fields = questions.map(q => {
          const title = q[1];
          const item = q[4] && q[4][0];
          if (!item) return null;
          const entryId = item[0];
          const rawOptions = item[1];
          const hasOther = Array.isArray(rawOptions) && (item[2] === 1 || rawOptions.some(o => o[4] === 1 || !o[0]));
          const options = Array.isArray(rawOptions)
            ? rawOptions.filter(o => o[0] && o[4] !== 1).map(o => o[0])
            : null;
          return {
            id: `entry.${entryId}`,
            title,
            type: options ? "choice" : "text",
            options,
            hasOther
          };
        }).filter(Boolean);

        return { formPath, fields };
      } catch (e) {
        return null;
      }
    }

    function extractFromSource() {
      const src = document.getElementById("source_input").value;
      const parsed = parseSourceData(src);
      const statusEl = document.getElementById("status");

      if (parsed && parsed.fields.length > 0) {
        if (parsed.formPath) {
          document.getElementById("url").value = `https://docs.google.com/forms/d/${parsed.formPath}/viewform`;
        }
        renderDynamicFields(parsed.fields);
        statusEl.className = "";
        statusEl.innerText = `Berhasil mengekstrak ${parsed.fields.length} pertanyaan! Silakan isi jawaban di bawah.`;
      } else {
        alert("Gagal membaca source code Google Form. Pastikan kode yang di-paste lengkap.");
      }
    }

    function toggleOther(selectEl, id) {
      const otherInput = document.getElementById(`other_${id}`);
      if (!otherInput) return;
      const isOther = selectEl.value === "__other__" || /^(?:lainnya|other|yang\s*lain)/i.test(selectEl.value.trim());
      otherInput.style.display = isOther ? "block" : "none";
      if (isOther) otherInput.focus();
    }

    function renderDynamicFields(fields) {
      loadedFields = fields;
      const container = document.getElementById("fields-container");
      const listEl = document.getElementById("dynamic-fields");
      listEl.innerHTML = "";

      fields.forEach((f, idx) => {
        const group = document.createElement("div");
        group.className = "field-group";

        const label = document.createElement("label");
        label.innerText = `${idx + 1}. ${f.title}`;
        group.appendChild(label);

        if (f.type === "choice" && Array.isArray(f.options)) {
          const select = document.createElement("select");
          select.id = `input_${f.id}`;
          select.onchange = () => toggleOther(select, f.id);
          let html = `<option value="">-- Pilih opsi --</option>` +
            f.options.map(opt => `<option value="${opt}">${opt}</option>`).join("");
          if (f.hasOther) {
            html += `<option value="__other__">-- Yang lain / Lainnya (Isi teks sendiri) --</option>`;
          }
          select.innerHTML = html;
          group.appendChild(select);

          if (f.hasOther) {
            const otherInput = document.createElement("input");
            otherInput.id = `other_${f.id}`;
            otherInput.placeholder = `Ketik jawaban '${f.title}' (Yang lain) di sini...`;
            otherInput.style.display = "none";
            otherInput.style.marginTop = "6px";
            group.appendChild(otherInput);
          }
        } else {
          const input = document.createElement("input");
          input.id = `input_${f.id}`;
          input.placeholder = `Jawaban untuk ${f.title}`;
          group.appendChild(input);
        }

        listEl.appendChild(group);
      });

      container.style.display = "block";
    }

    function getEntriesToSubmit() {
      const entries = [];
      for (const f of loadedFields) {
        const el = document.getElementById(`input_${f.id}`);
        if (!el) continue;

        if (el.tagName === "SELECT") {
          const isOther = el.value === "__other__" || /^(?:lainnya|other|yang\s*lain)/i.test(el.value.trim());
          if (isOther) {
            const otherEl = document.getElementById(`other_${f.id}`);
            const otherVal = otherEl ? otherEl.value.trim() : "";
            if (otherVal !== "") {
              entries.push([f.id, "__other_option__"]);
              entries.push([`${f.id}.other_option_response`, otherVal]);
            }
          } else if (el.value.trim() !== "") {
            entries.push([f.id, el.value.trim()]);
          }
        } else if (el.value.trim() !== "") {
          entries.push([f.id, el.value.trim()]);
        }
      }
      return entries;
    }

    function startWar() {
      const rawUrl = document.getElementById("url").value;
      const targetUrl = normalizeUrl(rawUrl);

      if (loadedFields.length === 0) {
        return alert("Silakan paste source HTML form dan klik 'Ekstrak Form' terlebih dahulu!");
      }

      if (!targetUrl.startsWith("http")) {
        return alert("URL Google Form tidak valid!");
      }

      for (const f of loadedFields) {
        const el = document.getElementById(`input_${f.id}`);
        if (!el || el.tagName !== "SELECT") continue;
        const isOther = el.value === "__other__" || /^(?:lainnya|other|yang\s*lain)/i.test(el.value.trim());
        if (isOther) {
          const otherEl = document.getElementById(`other_${f.id}`);
          if (!otherEl || !otherEl.value.trim()) {
            return alert(`Kolom teks "${f.title}" (Yang lain) wajib diisi jika memilih opsi tersebut!`);
          }
        }
      }

      const entries = getEntriesToSubmit();
      if (entries.length === 0) {
        return alert("Isi minimal satu kolom jawaban sebelum pasang timer!");
      }

      const h = parseInt(document.getElementById("h").value, 10);
      const m = parseInt(document.getElementById("m").value, 10);
      const s = parseInt(document.getElementById("s").value, 10);

      const form = document.getElementById("gform");
      form.action = targetUrl;
      form.innerHTML = "";
      entries.forEach(([k, v]) => {
        const input = document.createElement("input");
        input.name = k;
        input.value = v;
        form.appendChild(input);
      });

      const btn = document.getElementById("btn");
      const statusEl = document.getElementById("status");
      const audioEl = document.getElementById("keep_alive_audio");

      btn.disabled = true;
      statusEl.className = "waiting";
      const targetTimeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      statusEl.innerHTML = `<span class="pulse-dot"></span>Timer Aktif &bull; Menunggu pukul <strong>${targetTimeStr}</strong>...`;

      // Minta izin wake lock agar layar tidak mati
      requestWakeLock();

      // Putar audio hening agar OS Android/iOS tidak mematikan timer saat diminimize / pindah aplikasi
      if (audioEl) {
        audioEl.play().catch(() => {});
      }

      timer = setInterval(() => {
        const now = new Date();
        if (now.getHours() === h && now.getMinutes() === m && now.getSeconds() >= s) {
          clearInterval(timer);
          timer = null;
          form.submit();
          releaseWakeLock();
          if (audioEl) {
            audioEl.pause();
          }
          statusEl.className = "sent";
          statusEl.innerHTML = `&#10004; <strong>Terkirim!</strong> Form telah otomatis di-submit ke server Google.`;
        }
      }, 50);
    }

    if (typeof module !== "undefined" && module.exports) {
      module.exports = { normalizeUrl, parseSourceData, getEntriesToSubmit };
    }
  </script>
</body>
</html>
